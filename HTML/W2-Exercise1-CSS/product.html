<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Store</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>
    <header>
        <h1>Our products</h1>
    </header>
    <main class="product-container">
        <article class="product-card">
            <img src="./images/Projector1.jpg" alt="Projector image" width="600" height="400">
            <h2>Home Projector</h2>
            <p class="price">R2 500</p>
            <button class="add-to-cart">Add to cart</button>
        </article>
        <article class="product-card">
            <img src="./images/Wearbuds-7.jpg" alt="wearbuds image" width="600" height="400">
            <h2>wearbuds</h2>
            <p class="price">R2 000</p>
            <button class="add-to-cart">Add to cart</button>

        </article>
        
        <article class="product-card">
            <img src="./images/watch.jpg" alt="watch" width="600" height="400">
            <h2>Watch and Headsets</h2>
            <p class="price">R4 000</p>
            <button class="add-to-cart">Add to cart</button>
        </article>
        
        <article class="product-card">
            <img src="./images/61WLCXa6kxL._AC_.jpg" alt="wearbuds image" width="600" height="400">
            <h2>iPad</h2>
            <p class="price">R20 000</p>
            <button class="add-to-cart">Add to cart</button>
        </article>    
    </main>
    
</body>
</html>
