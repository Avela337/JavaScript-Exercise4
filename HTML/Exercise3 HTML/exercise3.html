<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewpoint" content="width=device-width, initial-scale=1.0">
        <title>Province Data Table</title>
        <style>
            table{
                width: 40%;
                border-collapse: collapse;
            }
            th,td{
                border: 1px solid black;
                padding: 8px;
            }

            .nam {
                text-align: right;
            }
            
        </style>
    </head>
    <body>
        <table height="350px" width="80%">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Province</th>
                    <th>population(2011)</th>
                    <th>Area (km<sup>2</sup>)</th>
                    <th>Density(per km<sup>2</sup>)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>Gauteng</td>
                    <td class="nam">12,272,263</td>
                    <td class="nam">18,178</td>
                    <td class="nam">675.1</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>KwaZulu-Natal</td>
                    <td class="nam">10,267,300</td>
                    <td class="nam">120,361</td>
                    <td class="nam">85.3</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>Mpumalanga</td>
                    <td class="nam">4,039,939</td>
                    <td class="nam">76,495</td>
                    <td class="nam">52.8</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>Western Cape</td>
                    <td class="nam">5,822,734</td>
                    <td class="nam">129,462</td>
                    <td class="nam">45.0</td>

                </tr>

                <tr>
                <td>5</td>
                <td>Limpopo</td>
                <td class="nam">5,404,868</td>
                <td class="nam">125,755</td>
                <td class="nam">43.0</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
